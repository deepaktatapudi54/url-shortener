services:
  - type: web
    name: deepak-url-shortener
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PORT
        value: "8000"
